# judge0.conf
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=secure_postgres_password

REDIS_PASSWORD=secure_redis_password

# The maximum queue size per worker. Setting this to 0 means infinite.
MAX_QUEUE_SIZE=0

# Number of concurrent workers (adjust based on load testing)
WORKERS=4

# Memory limit for submissions (in KB)
MEMORY_LIMIT=262144

# CPU time limit (in seconds)
CPU_TIME_LIMIT=2.0
